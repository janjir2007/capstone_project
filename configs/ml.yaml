# =====================================================================
# ML settings — tasks 2.1–2.3a (EDA, split, baselines); 2.3b reuses the split.
# Read by: src/ml/dataset.py, src/ml/baselines.py, src/ml/train.py, src/ml/evaluate.py, notebooks/01_eda.ipynb
# Tags as in configs/generator.yaml: [SOURCE: ...] checkable, [ESTIMATE] placeholder.
# =====================================================================

seed: 42

input: data/synthetic/service_records_cleaned.csv   # output of task 1.4 (git-ignored)
vehicle_col: vehicle_key                              # one truck = one key (cleaned plate)

# Route km/day for B1 and the route features. Until task 1.1c puts round-trip
# days in the destinations table, they come from the generator's [ESTIMATE]
# ranges at their middle (same numbers as docs/synthetic_report.md §3).
generator_config: configs/generator.yaml

split:
  # D-009: no truck in both train and test, and test is LATER in time than train.
  test_vehicle_share: 0.2      # [ESTIMATE] share of trucks held out
  cutoff_quantile: 0.7         # [ESTIMATE] cutoff date = this quantile of service dates
  # train = train trucks, visits whose NEXT visit is before the cutoff (target fully in the past)
  # test  = test trucks, visits on/after the cutoff

features:
  late_km: 20000               # [SOURCE: D-030 / D-047] more km than this = late interval

baselines:
  # D-049: official B1 = expected ACTUAL km (middle of 15k–20k, D-030): we predict when the truck really returns.
  # B1 km/day checked against the generator in 2.3b: includes waiting, matches its trips within ~3% (ml_results.md §1).
  b1_interval_km: 17500        # [SOURCE: D-049]
  b1_sensitivity_km: [15000]   # [SOURCE: D-030] recommended interval; shown, not the official B1

reminder:
  # D-036: hit = reminder lands this many days BEFORE the actual visit.
  window_days_early: [1, 14]   # [SOURCE: D-051, PROPOSED — Ari to confirm] configurable; was [3, 7] in 2.1–2.3b (D-049 default)
  sensitivity_windows: [[3, 7]]  # [SOURCE: D-049] old window, shown in docs/ml_evaluation.md for comparison
  buffer_days: 0               # reminder sent this many days before the predicted date (baselines report only)

report_path: docs/ml_baselines.md
figures_dir: docs/figures

# Task 2.3b: Ridge / Random Forest / XGBoost. Everything here is tuned on TRAIN only.
models:
  cv_folds: 5                  # GroupKFold by truck inside TRAIN (no truck in two folds)
  n_iter: 25                   # RandomizedSearchCV draws per model
  # Best model = lowest MAE on out-of-fold (validation) predictions of TRAIN — never test.
  # Reminder buffer = days early that maximizes the hit rate on the same out-of-fold predictions.
  buffer_range_days: [0, 30]
  bootstrap_resamples: 2000    # test MAE difference vs B0, resampling whole trucks
  model_dir: models            # git-ignored
  results_path: docs/ml_results.md
  serving_model: Ridge         # [SOURCE: PROJECT_STATE v2.1 / brief 2.4] saved to model_dir for the API

# Task 2.4: explanation + evaluation (src/ml/explain.py, src/ml/evaluate.py).
evaluation:
  report_path: docs/ml_evaluation.md
  d038_tolerance_days: 0.5    # [ESTIMATE] variation OFF: ML may beat calibrated B1 by at most this (MAE days)
  status:
    # D-007: OK > due_soon_days left; Due soon 0..due_soon_days; Overdue < 0 (adjustable, Ari).
    due_soon_days: 14          # [SOURCE: D-007]
    # The status is checked every N days after a service, until this many days after
    # the actual next visit (true due date = actual next visit, the only one we observe).
    check_every_days: 7        # [ESTIMATE] evaluation protocol, not a business fact
    check_after_due_days: 14   # [ESTIMATE] evaluation protocol
  shap:
    top_features: 12           # columns shown in the beeswarm summary plots
    example_min_prior_visits: 2  # example truck: needs this much history (choice uses predictions only, never the target)
