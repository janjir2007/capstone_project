# Local development services (D-011: local PostgreSQL in Docker).
#
# Start:   docker compose up -d db        (database only, e.g. for pytest)
#          docker compose up -d --build   (database + API on http://localhost:8000)
# Stop:    docker compose down          (keeps data)
# Reset:   docker compose down -v       (deletes the volume -> schema.sql runs again)
#
# Credentials come from environment variables / the .env file (never committed).
# The ":-" defaults are for local development only.

services:
  db:
    image: postgres:16
    container_name: ocp-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oil_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-oil_change}
      # Business runs in Mongolia: CURRENT_DATE and now() use Ulaanbaatar time.
      TZ: Asia/Ulaanbaatar
      PGTZ: Asia/Ulaanbaatar
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Database files live in a named volume, so data survives container restarts.
      - pgdata:/var/lib/postgresql/data
      # Scripts in /docker-entrypoint-initdb.d/ run ONCE, when the volume is empty.
      - ./src/data/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      # Migrations, in order (an existing volume needs them run by hand: README).
      - ./src/data/migrations/001_destinations.up.sql:/docker-entrypoint-initdb.d/02_migration_001_destinations.sql:ro
      - ./src/data/migrations/002_destinations_name_mn.up.sql:/docker-entrypoint-initdb.d/03_migration_002_destinations_name_mn.sql:ro
      - ./src/data/migrations/003_reminders_sent.up.sql:/docker-entrypoint-initdb.d/04_migration_003_reminders_sent.sql:ro
      # All SQL files, available inside the container for manual psql -f runs.
      - ./src/data:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # FastAPI service (task 4.1). Health: curl http://localhost:8000/health
  api:
    build: .
    container_name: ocp-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_USER: ${POSTGRES_USER:-oil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oil_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-oil_change}
      # Inside the compose network the database is reached by service name on
      # its container port 5432 (POSTGRES_PORT above is only the HOST port).
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TZ: Asia/Ulaanbaatar
      # Task 4.3: model files are git-ignored and NOT in the image (.dockerignore);
      # they are mounted read-only from ./models (make them with the 4.3 handoff "HOW TO RUN").
      MODEL_DIR: /app/models
      # Task 4.4: contact in the reminder message (placeholder until Ari sets the real number in .env).
      GEO_EXPERT_NAME: ${GEO_EXPERT_NAME:-Geo-Expert}
      GEO_EXPERT_PHONE: ${GEO_EXPERT_PHONE:-99000000}
    volumes:
      - ./models:/app/models:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy  # wait for pg_isready before starting the API

volumes:
  pgdata:
