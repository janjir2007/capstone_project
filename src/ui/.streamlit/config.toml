# Streamlit theme + client settings — DESIGN v4 (task T7: calm, modern, light).
# Streamlit reads .streamlit/config.toml from the CURRENT folder, so start the app
# from src/ui/:   cd src/ui && streamlit run app.py   (docs/ui_run.md)
# Primary color #1F4E9D is a placeholder until Geo-Expert's brand color is known.
# Contrast (WCAG): text #111827 16:1, secondary grey #4B5563 ≥ 6.6:1 on every background, white on primary 8:1 (5.6).

[theme]
base = "light"
primaryColor = "#1F4E9D"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#F3F4F6"  # input fill (no border; primary border only on focus)
textColor = "#111827"
borderColor = "#E5E7EB"
showWidgetBorder = false
baseRadius = "12px"
buttonRadius = "14px"
baseFontSize = 15
baseFontWeight = 400
# Task 5.6: no web font. The real font stack (phone system font: San Francisco on iPhone) is set in
# common.CSS, because Montserrat 400 looked too light on iPhone and web fonts are blocked in Lockdown
# Mode. ("sans-serif" here only sets Streamlit's own default; our CSS overrides it.)
font = "sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]

[client]
toolbarMode = "viewer"           # no "Deploy" button / developer menu
showSidebarNavigation = false    # the app navigates with its own buttons

[server]
headless = true
maxUploadSize = 15                # MB, same limit as POST /plates/recognize (API returns 413 above)

[browser]
gatherUsageStats = false
