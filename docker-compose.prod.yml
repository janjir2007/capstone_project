# Production stack on ONE Linux server (task 6.1, D-061): db + api + ui + Caddy (HTTPS).
# Host-agnostic: any VPS with Docker + Compose. Runbook: docs/deploy.md.
#
#   cp .env.prod.example .env      # then fill in real values (never committed)
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm api python -m scripts.migrate
#   docker compose -f docker-compose.prod.yml run --rm api python -m src.data.seed_demo --as-of 2026-10-20
#   docker compose -f docker-compose.prod.yml up -d
#
# Differences from docker-compose.yml (local dev):
# - Only Caddy publishes ports (80, 443). db, api and ui are reachable only inside the
#   compose network: the API is not public (D-061), the UI is behind HTTPS.
# - No default passwords: compose refuses to start if a required value is missing in .env.
# - The db container runs ONLY schema.sql on a fresh volume; migrations 001+ are applied by
#   scripts/migrate.py, which records them in schema_migrations (D-041, D-069).
# - Own project name -> own volumes and network, never mixed with the dev database.

name: ocp-prod

x-logging: &logging
  # Keep container logs from filling a small server's disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oil_change}
      # Business runs in Mongolia: CURRENT_DATE and now() use Ulaanbaatar time.
      TZ: Asia/Ulaanbaatar
      PGTZ: Asia/Ulaanbaatar
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONCE, when the volume is empty. Migrations come from scripts/migrate.py.
      - ./src/data/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  api:
    build: .
    image: ocp-api:prod
    environment:
      APP_ENV: prod
      POSTGRES_USER: ${POSTGRES_USER:-oil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oil_change}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TZ: Asia/Ulaanbaatar
      # Model files are git-ignored and not in the image: copied to ./models on the server
      # (docs/deploy.md step 3), mounted read-only. Includes plate_ocr/char_cnn_version.json
      # (served CNN + its auto-fill threshold, D-089). Missing files -> prediction null / 503.
      MODEL_DIR: /app/models
      GEO_EXPERT_NAME: ${GEO_EXPERT_NAME:-Geo-Expert}
      # 99000000 = placeholder; the API then reports contact_is_placeholder: true (D-068).
      GEO_EXPERT_PHONE: ${GEO_EXPERT_PHONE:-99000000}
      # Task 9.5b: the oil changer's number at the end of every reminder (wins over GEO_EXPERT_PHONE).
      CONTACT_PHONE: ${CONTACT_PHONE:-}
      # Task 9.5a: target km of the next oil change = odometer at the last change + this.
      OIL_INTERVAL_KM: ${OIL_INTERVAL_KM:-12000}   # 9.14a: was 15000; stored on each service
      # Task 9.5c: reminder REMINDER_DAYS after the latest service; at risk after AT_RISK_DAYS.
      REMINDER_DAYS: ${REMINDER_DAYS:-75}
      AT_RISK_DAYS: ${AT_RISK_DAYS:-150}
      # Task 9.14a: reminder this many days before the km/day due day; km check this many days after the service.
      REMINDER_LEAD_DAYS: ${REMINDER_LEAD_DAYS:-5}
      KM_CHECK_DAYS: ${KM_CHECK_DAYS:-34}
      # Task 8.5r (D-117): the API serves the login page and signs the 30-day cookie, so the
      # password lives here now (not in ui). New UI_PASSWORD -> every cookie invalid = all logged out.
      UI_PASSWORD: ${UI_PASSWORD:?set UI_PASSWORD in .env (company login, D-061)}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -hex 32, task 8.5r)}
      # Task 9.15a: Messenger km bot. Both switches off by default (safe to deploy before Meta).
      # The META_* values live ONLY in the server .env (never in git, never logged); empty defaults
      # so `compose config` works before Meta is set up. MESSENGER_ENABLED=true with any of them
      # empty -> the API does not start. docs/deploy.md §14.
      MESSENGER_ENABLED: ${MESSENGER_ENABLED:-false}
      MESSENGER_OTN_ENABLED: ${MESSENGER_OTN_ENABLED:-false}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_PAGE_TOKEN: ${META_PAGE_TOKEN:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
      MESSENGER_PAGE_USERNAME: ${MESSENGER_PAGE_USERNAME:-}  # 9.15a-3: m.me link in the km-check SMS (not a secret)
    volumes:
      - ./models:/app/models:ro
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Task 9.6b-3: Artlab -> database sync, one run per call (deploy/systemd/ocp-artlab-*).
  # Profile "sync": never started by `up -d`; systemd runs it with `--profile sync run --rm`.
  # Same image as api, but only the database + Artlab settings: the web API never holds the
  # Artlab credentials. NOT installed on the server until the accounting OK (D-114).
  artlab-sync:
    image: ocp-api:prod
    profiles: ["sync"]
    environment:
      APP_ENV: prod
      POSTGRES_USER: ${POSTGRES_USER:-oil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oil_change}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TZ: Asia/Ulaanbaatar
      # Empty defaults so `docker compose config` works before Artlab is set up; the sync
      # itself stops with "Missing in .env: ..." if the login values are empty.
      ARTLAB_URL: ${ARTLAB_URL:-}
      ARTLAB_USER: ${ARTLAB_USER:-}
      ARTLAB_PASS: ${ARTLAB_PASS:-}
      ARTLAB_BANK_ACCOUNTS: ${ARTLAB_BANK_ACCOUNTS:-}
      ARTLAB_CREDIT_PAY_TYPES: ${ARTLAB_CREDIT_PAY_TYPES:-LOAN}
      ARTLAB_ZERO_ROW_WARN_RUNS: ${ARTLAB_ZERO_ROW_WARN_RUNS:-12}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  ui:
    # Values from docs/ui_run.md §3 (task T5).
    build:
      context: .
      dockerfile: src/ui/Dockerfile
    image: ocp-ui:prod
    environment:
      API_URL: http://api:8000   # login is checked by the API (/auth/check), no password here
    expose:
      - "8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  caddy:
    # HTTPS (the phone browser's camera needs it, D-061). Caddy gets and renews a Let's Encrypt
    # certificate for DOMAIN by itself; for DOMAIN=localhost it uses its own local certificate.
    image: caddy:2.11.7-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. app.geoexpert.mn, <ip>.sslip.io or localhost)}
      # Previous public address -> redirected to DOMAIN (task 8.3). Optional.
      OLD_DOMAIN: ${OLD_DOMAIN:-old.localhost}
    ports:
      - "80:80"        # Let's Encrypt HTTP challenge + redirect to https
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here: keep this volume, or Let's Encrypt rate limits can hit on re-deploys.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
      - api
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
