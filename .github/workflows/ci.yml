# CI = Continuous Integration. On every push / pull request to main,
# GitHub starts a fresh Linux machine, installs our dependencies and runs tests.
#
# Task 6.2: a Postgres service so the database tests RUN (they skip without one), the UI
# packages so the UI screen tests run, and a second job that builds both Docker images.
# Task 9.7: a third job scans the FULL git history for secrets with gitleaks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # run CI by hand on any branch: gh workflow run CI --ref <branch>

jobs:
  # Task 9.7 (D-102, RISK-22): fail if any password / token / key is in ANY commit.
  # The binary is pinned and checked against the SHA-256 from the release's checksums.txt,
  # so a changed download fails instead of running. Allowlisted test fixtures: .gitleaks.toml.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1" # released 2026-03-21
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # linux_x64
    steps:
      - name: Check out the code (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # --redact: findings are printed with the secret replaced by REDACTED (public CI logs).
      # --log-opts=HEAD: scan every commit in the history of the checked-out commit only.
      # fetch-depth 0 also fetches other branches; without this a leak on any branch would
      # turn every run red (seen in task 9.7 with the canary branch).
      - name: Scan full git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts=HEAD --redact --verbose --no-banner --exit-code 1 .

  test:
    runs-on: ubuntu-latest
    services:
      # Same image as docker-compose.yml. Tests create throwaway schemas and roll back.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oil
          POSTGRES_PASSWORD: oil_ci_password
          POSTGRES_DB: oil_change
          TZ: Asia/Ulaanbaatar
          PGTZ: Asia/Ulaanbaatar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oil -d oil_change"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Read by tests/test_schema.py database_url() and src/api/config.py.
      POSTGRES_USER: oil
      POSTGRES_PASSWORD: oil_ci_password
      POSTGRES_DB: oil_change
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (backend + UI)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ui.txt

      - name: Migrations apply on an empty database, second run is a no-op
        run: |
          python -c "import psycopg; from tests.test_schema import database_url; \
            psycopg.connect(database_url(), autocommit=True).execute(open('src/data/schema.sql').read())"
          python -m scripts.migrate
          python -m scripts.migrate | tee migrate2.txt
          grep -q "nothing to apply" migrate2.txt

      # Exit code 134 after all tests passed = known abort in native teardown (task 6.2);
      # scripts/ci_check_pytest.py judges the run from the JUnit report and fails on any
      # skip except the allowed ones listed there (so DB and UI tests must really run).
      - name: Run tests
        run: |
          set +e
          pytest -v -rs --junitxml=pytest-report.xml
          code=$?
          set -e
          python -m scripts.ci_check_pytest pytest-report.xml "$code"

  images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Production compose file is valid
        run: |
          cp .env.prod.example .env.ci
          docker compose -f docker-compose.prod.yml --env-file .env.ci config --quiet

      - name: Build API image
        run: docker build -t ocp-api:ci .

      - name: Build UI image
        run: docker build -f src/ui/Dockerfile -t ocp-ui:ci .

      - name: Images contain what the deploy runs (API + migrate + seed; UI)
        run: |
          docker run --rm ocp-api:ci python -c "import src.api.main, scripts.migrate, src.data.seed_demo; print('api imports ok')"
          docker run --rm ocp-ui:ci python -c "import streamlit; print('ui imports ok')"
